# ==============================================================================
# VMS Backend - Local Development Profile
# Connects to configured SQL database via DB_URL or falls back to local H2
# ==============================================================================
spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:vms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: ${DB_DRIVER:${SPRING_DATASOURCE_DRIVER:}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

logging:
  level:
    root: INFO
    com.starkgroup.vms: DEBUG
    org.springframework.jdbc: DEBUG
