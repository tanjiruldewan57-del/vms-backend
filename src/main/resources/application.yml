# ==============================================================================
# VMS Backend - Base Configuration (RFC 9110 / OWASP Hardened)
# Environment-Based SQL Database & Spring Data JPA Connectivity Foundation
# ==============================================================================
spring:
  application:
    name: vms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Database Connectivity Foundation (Driven entirely by Environment Variables)
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/vms_db}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:vms_user}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: ${DB_DRIVER:${SPRING_DATASOURCE_DRIVER:}}
    hikari:
      pool-name: VmsHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      auto-commit: true

  # Spring Data JPA Foundation
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Actuator Health Check Configuration (Publicly accessible for Render health checks)
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true

# Security & CORS Constraints (Whitelisting local development and deployed Netlify Flutter Web app)
vms:
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:8000,http://localhost:8000,https://bespoke-mochi-006b8f.netlify.app}"
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Requested-With
        - Accept
        - Origin
      allow-credentials: true
      max-age: 3600
